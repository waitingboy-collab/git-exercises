<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A fast, precise unit converter for length, temperature and more.">
  <meta name="theme-color" content="#f5f5f1">
  <title>Unit Converter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131a22'/%3E%3Cpath d='M9 12h14l-4-4M23 20H9l4 4' fill='none' stroke='%23f5f5f1' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="unit-converter.css">
  <script src="unit-converter.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <div class="app-brand">
        <span class="app-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" focusable="false"><path d="M6 9h12l-3.5-3.5M18 15H6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div>
          <h1 class="app-title">Unit Converter</h1>
          <p class="app-subtitle">Precise conversions, right in your browser</p>
        </div>
      </div>
    </div>

    <div class="container">
      <nav class="tabs-nav" aria-label="Converter categories">
        <div class="tabs" role="tablist" aria-label="Converter categories">
          <button type="button" class="tab" role="tab" id="tab-length" data-converter="length" aria-controls="converter-panel" aria-selected="true">Length</button>
          <button type="button" class="tab" role="tab" id="tab-temperature" data-converter="temperature" aria-controls="converter-panel" aria-selected="false" tabindex="-1">Temperature</button>
          <button type="button" class="tab" role="tab" id="tab-weight" data-converter="weight" aria-controls="converter-panel" aria-selected="false" tabindex="-1">Weight</button>
          <button type="button" class="tab" role="tab" id="tab-volume" data-converter="volume" aria-controls="converter-panel" aria-selected="false" tabindex="-1">Volume</button>
          <button type="button" class="tab" role="tab" id="tab-speed" data-converter="speed" aria-controls="converter-panel" aria-selected="false" tabindex="-1">Speed</button>
          <button type="button" class="tab" role="tab" id="tab-area" data-converter="area" aria-controls="converter-panel" aria-selected="false" tabindex="-1">Area</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container app-main">
    <!-- The active converter is rendered here by unit-converter.js -->
    <section id="converter-panel" class="converter-card" role="tabpanel" aria-labelledby="tab-length" tabindex="0"></section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>&copy; 2026 Radoslav Chakarov</p>
    </div>
  </footer>
</body>
</html>
